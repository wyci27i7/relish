server:
  port: 8081
spring:
  application:
    name: relish
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.24.195.136:3306/relish
    username: dev
    password: 123456
  data:
    redis:
      host: 172.24.195.136
      port: 6379
  rabbitmq:
    host: 172.24.195.136
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    # 生产者确认：消息是否到达交换机（异步回调，不阻塞发送）
    publisher-confirm-type: correlated
    # 生产者Returns：路由不到队列时退回
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual   # 手动ACK：事务提交成功后才basicAck
        concurrency: 1             # 开发阶段单线程消费，方便看日志
        max-concurrency: 1
        prefetch: 1                 # 开发阶段一次只给一条，调试友好


mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

