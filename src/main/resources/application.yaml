server:
  port: 8081

spring:
  application:
    name: relish
  datasource:
    hikari:
      maximum-pool-size: 30
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.24.195.136:3306/relish
    username: dev
    password: 123456
  data:
    redis:
      host: 172.24.195.136
      port: 6379
  rabbitmq:
    host: 172.24.195.136
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 10
        max-concurrency: 10
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000


mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

